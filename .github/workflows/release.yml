name: Release

on:
  push:
    tags:
      - 'v*'

# A tag push is the only thing that triggers a release. Concurrency is set
# per-tag so two pushes of the same tag don't race on the Release object.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify skill bundle
        run: |
          set -euo pipefail
          if [ ! -d "skills/agent-project-governance" ]; then
            echo "::error::skills/agent-project-governance/ is missing; cannot package the skill."
            exit 1
          fi
          if [ ! -f "skills/agent-project-governance/SKILL.md" ]; then
            echo "::error::skills/agent-project-governance/SKILL.md is missing; cannot package the skill."
            exit 1
          fi
          echo "Skill bundle at skills/agent-project-governance/ is ready to package."

      - name: Validate skill sources
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; text=File.read("skills/agent-project-governance/SKILL.md"); YAML.safe_load(text.split("---",3)[1]); puts "skill frontmatter ok"'
          ruby -e 'require "yaml"; YAML.load_file("skills/agent-project-governance/agents/openai.yaml"); puts "openai yaml ok"'
          ruby -e 'require "json"; JSON.parse(File.read("skills/agent-project-governance/assets/manifest.schema.json")); puts "manifest schema json ok"'
          sh -n skills/agent-project-governance/scripts/validate_project_governance.sh
          sh -n skills/agent-project-governance/scripts/test_validate_project_governance.sh
          sh skills/agent-project-governance/scripts/test_validate_project_governance.sh
          pwsh -NoProfile -Command '& { $files = @("skills/agent-project-governance/scripts/validate_project_governance.ps1", "skills/agent-project-governance/scripts/test_validate_project_governance.ps1"); foreach ($file in $files) { $tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 } }; "powershell syntax ok" }'
          pwsh -NoProfile -File skills/agent-project-governance/scripts/test_validate_project_governance.ps1

      - name: Package skill bundle
        working-directory: skills
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Layout: each archive's top-level directory is
          # `agent-project-governance/`, so extracting into <skills-dir> installs
          # the skill in one step.
          zip -r "../agent-project-governance-${TAG}.zip" agent-project-governance
          tar -czf "../agent-project-governance-${TAG}.tar.gz" agent-project-governance
          tar -cf - agent-project-governance | zstd -T0 -o "../agent-project-governance-${TAG}.tar.zst"

      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          RELEASE_NOTES_FILE="releases/${TAG}.md"

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "::error::Missing ${RELEASE_NOTES_FILE}. Write agent-authored release notes before pushing ${TAG}."
            exit 1
          fi

          {
            cat "$RELEASE_NOTES_FILE"
            echo
            echo "## Commits"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Since \`$PREVIOUS_TAG\`:"
              echo
              git log --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..${TAG}" |
                sed -E 's/ \[model:[^]]+\]//g'
              echo
              echo
              echo "Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            else
              echo "Initial release:"
              echo
              git log --pretty=format:'- %s (%h)' "$TAG" |
                sed -E 's/ \[model:[^]]+\]//g'
            fi

            cat <<NOTES | sed 's/^  //'

            ## Skill bundle

            Download an archive for your environment and extract it directly
            into your agent's skill directory. Each archive's top-level
            directory is \`agent-project-governance/\`, so a single extraction
            places the skill at the correct path.

            - Windows: use \`agent-project-governance-${TAG}.zip\`
            - Unix-like environments with zstd: use \`agent-project-governance-${TAG}.tar.zst\`
            - Other Unix-like environments: use \`agent-project-governance-${TAG}.tar.gz\`

            ### Install on Unix-like environments

            \`\`\`bash
            # Pick the directory that matches your agent; examples below.
            SKILLS_DIR=.opencode/skills   # project-level
            # SKILLS_DIR=~/.config/opencode/skills   # global
            VERSION=${TAG}

            mkdir -p "\$SKILLS_DIR"
            rm -rf "\$SKILLS_DIR/agent-project-governance"
            if command -v zstd >/dev/null 2>&1; then
              curl -L --fail -o /tmp/agent-project-governance.tar.zst "https://github.com/${GITHUB_REPOSITORY}/releases/download/\${VERSION}/agent-project-governance-\${VERSION}.tar.zst"
              zstd -dc /tmp/agent-project-governance.tar.zst | tar -xf - -C "\$SKILLS_DIR"
              rm /tmp/agent-project-governance.tar.zst
            else
              curl -L --fail -o /tmp/agent-project-governance.tar.gz "https://github.com/${GITHUB_REPOSITORY}/releases/download/\${VERSION}/agent-project-governance-\${VERSION}.tar.gz"
              tar -xzf /tmp/agent-project-governance.tar.gz -C "\$SKILLS_DIR"
              rm /tmp/agent-project-governance.tar.gz
            fi
            \`\`\`

            See the [README](https://github.com/${GITHUB_REPOSITORY}#quick-start)
            for the full installation guide and per-agent directory conventions.
          NOTES
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md
          files: |
            agent-project-governance-${{ github.ref_name }}.zip
            agent-project-governance-${{ github.ref_name }}.tar.gz
            agent-project-governance-${{ github.ref_name }}.tar.zst
