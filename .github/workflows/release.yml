name: Release

on:
  push:
    tags:
      - 'v*'

# A tag push is the only thing that triggers a release. Concurrency is set
# per-tag so two pushes of the same tag don't race on the Release object.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify skill bundle
        run: |
          set -euo pipefail
          if [ ! -d "skills/agent-project-governance" ]; then
            echo "::error::skills/agent-project-governance/ is missing; cannot package the skill."
            exit 1
          fi
          if [ ! -f "skills/agent-project-governance/SKILL.md" ]; then
            echo "::error::skills/agent-project-governance/SKILL.md is missing; cannot package the skill."
            exit 1
          fi
          echo "Skill bundle at skills/agent-project-governance/ is ready to package."

      - name: Validate skill sources
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; text=File.read("skills/agent-project-governance/SKILL.md"); YAML.safe_load(text.split("---",3)[1]); puts "skill frontmatter ok"'
          ruby -e 'require "yaml"; YAML.load_file("skills/agent-project-governance/agents/openai.yaml"); puts "openai yaml ok"'
          sh -n skills/agent-project-governance/scripts/validate_project_governance.sh
          sh -n skills/agent-project-governance/scripts/test_validate_project_governance.sh
          sh skills/agent-project-governance/scripts/test_validate_project_governance.sh

      - name: Package skill bundle
        working-directory: skills
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Layout: each archive's top-level directory is
          # `agent-project-governance/`, so extracting into <skills-dir> installs
          # the skill in one step.
          zip -r "../agent-project-governance-${TAG}.zip" agent-project-governance
          tar -czf "../agent-project-governance-${TAG}.tar.gz" agent-project-governance
          tar -cf - agent-project-governance | zstd -T0 -o "../agent-project-governance-${TAG}.tar.zst"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Skill bundle

            Download an archive for your environment and extract it directly
            into your agent's skill directory. Each archive's top-level
            directory is `agent-project-governance/`, so a single extraction
            places the skill at the correct path.

            - Windows: use `agent-project-governance-${{ github.ref_name }}.zip`
            - Unix-like environments with zstd: use `agent-project-governance-${{ github.ref_name }}.tar.zst`
            - Other Unix-like environments: use `agent-project-governance-${{ github.ref_name }}.tar.gz`

            ### Install on Unix-like environments

            ```bash
            # Pick the directory that matches your agent; examples below.
            SKILLS_DIR=.opencode/skills   # project-level
            # SKILLS_DIR=~/.config/opencode/skills   # global
            VERSION=${{ github.ref_name }}

            mkdir -p "$SKILLS_DIR"
            rm -rf "$SKILLS_DIR/agent-project-governance"
            if command -v zstd >/dev/null 2>&1; then
              curl -L --fail -o /tmp/agent-project-governance.tar.zst \
                "https://github.com/${{ github.repository }}/releases/download/${VERSION}/agent-project-governance-${VERSION}.tar.zst"
              zstd -dc /tmp/agent-project-governance.tar.zst | tar -xf - -C "$SKILLS_DIR"
              rm /tmp/agent-project-governance.tar.zst
            else
              curl -L --fail -o /tmp/agent-project-governance.tar.gz \
                "https://github.com/${{ github.repository }}/releases/download/${VERSION}/agent-project-governance-${VERSION}.tar.gz"
              tar -xzf /tmp/agent-project-governance.tar.gz -C "$SKILLS_DIR"
              rm /tmp/agent-project-governance.tar.gz
            fi
            ```

            See the [README](https://github.com/${{ github.repository }}#quick-start)
            for the full installation guide and per-agent directory conventions.
          files: |
            agent-project-governance-${{ github.ref_name }}.zip
            agent-project-governance-${{ github.ref_name }}.tar.gz
            agent-project-governance-${{ github.ref_name }}.tar.zst
